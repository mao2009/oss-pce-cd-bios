# Test-only 8 KiB HuCARD image for the Issue #473 caller-stack experiment. Not a BIOS, no reference material.
MEMORY {
    ROM: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    CODE: load = ROM, type = ro, start = $E000;
    VECTORS: load = ROM, type = ro, start = $FFF6;
}
