name: Real Geargrafx ex_bcdbin (Issue #71, internal routine, not BIOS)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bcdbin-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned cc65 and Geargrafx from source
        run: make setup
      - name: Real-core ex_bcdbin run (exit code is the job result; BLOCKED=3, failure=1)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-bcdbin
          python3 tests/integration/geargrafx_bcdbin.py 2>&1 | tee build/ci-bcdbin/bcdbin-core.log
      - name: Hand off the real-core ex_bcdbin log as an intermediate artifact (the guard job publishes it)
        run: |
          mkdir -p intermediate
          cp --parents build/ci-bcdbin/bcdbin-core.log intermediate/
      - name: Intermediate real-core ex_bcdbin log artifact (the guard job publishes it)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intermediate-bcdbin-core-${{ github.sha }}
          path: intermediate/
          if-no-files-found: error
          retention-days: 1
  guard-bcdbin-core:
    # Publishes only the log the build job handed over. It runs no build code: the trusted main guard, python3
    # resolved before anything else, the workflow files for the placement check, the download, the stage, the verify
    # and the upload. Runs only when the build job succeeded (same as ci.yml); a failed run keeps its log in the job log.
    needs: bcdbin-core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout workflow files only (data for the placement check)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Trusted guard (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: .trusted-main
          sparse-checkout: tools
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve python3 (trusted)
        id: pyresolve
        run: |
          echo "python=$(command -v python3)" >> "$GITHUB_OUTPUT"
      - name: Guard placement (trusted)
        run: |
          "${{ steps.pyresolve.outputs.python }}" ".trusted-main/tools/artifact_guard.py" --root "$GITHUB_WORKSPACE" --check-placement
      - name: Download intermediate real-core ex_bcdbin log artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: intermediate-bcdbin-core-${{ github.sha }}
          path: .intake
      - name: Stage artifacts (trusted guard) for Save real-core ex_bcdbin log
        run: |
          "${{ steps.pyresolve.outputs.python }}" ".trusted-main/tools/artifact_guard.py" --root ".intake" --workflow-root "$GITHUB_WORKSPACE" --stage .github/workflows/core-bcdbin.yml "Save real-core ex_bcdbin log"
      - name: Verify staged artifacts (trusted guard) for Save real-core ex_bcdbin log
        run: |
          "${{ steps.pyresolve.outputs.python }}" ".trusted-main/tools/artifact_guard.py" --root ".intake" --workflow-root "$GITHUB_WORKSPACE" --verify .github/workflows/core-bcdbin.yml "Save real-core ex_bcdbin log"
      - name: Save real-core ex_bcdbin log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bcdbin-core-log-${{ github.sha }}
          path: .intake/.artifact-stage/build/ci-bcdbin/bcdbin-core.log
          if-no-files-found: error
          retention-days: 14
