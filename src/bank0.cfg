# Provisional 8KB bank0 mapping, physical ROM bank count handled by build_rom.py.
# This does NOT prove Super System Card 3.0 emulator boot compatibility.
MEMORY {
    ROM0: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    APITABLE: load = ROM0, type = ro, start = $E000;
    FALLBACK: load = ROM0, type = ro, start = $E100;
    OVERRIDES: load = ROM0, type = ro, start = $E600, optional = yes;
    BOOT: load = ROM0, type = ro, start = $F000;
    VECTORS: load = ROM0, type = ro, start = $FFF6;
}
