# One headerless 8 KiB HuCARD bank at CPU $E000-$FFFF plus the routine's BSS state (Issue #72 probe only).
MEMORY {
    ROM: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
    RAM: start = $2000, size = $0010, type = rw;
}
SEGMENTS {
    RESET: load = ROM, type = ro, start = $E000;
    CODE: load = ROM, type = ro, start = $E100;
    VECTORS: load = ROM, type = ro, start = $FFF6;
    BSS: load = RAM, type = bss, start = $2000;
}
