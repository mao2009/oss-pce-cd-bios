# One headerless 8 KiB HuCARD bank at CPU $E000-$FFFF for the ex_bcdbin harness (not a BIOS).
MEMORY {
    ROM: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    RESET: load = ROM, type = ro, start = $E000;
    CODE: load = ROM, type = ro;
    VECTORS: load = ROM, type = ro, start = $FFF6;
}
