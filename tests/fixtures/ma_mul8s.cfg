# MA_MUL8S test HuCARD: one 8 KiB bank at CPU $E000-$FFFF (not a BIOS layout).
MEMORY {
    ROM: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    RESET: load = ROM, type = ro, start = $E000;
    MATHLIB: load = ROM, type = ro, start = $E400;
    VECTORS: load = ROM, type = ro, start = $FFF6;
}
