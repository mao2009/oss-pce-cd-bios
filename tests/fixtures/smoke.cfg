# One headerless 8 KiB bank mapped by the test to CPU $E000-$FFFF.
MEMORY {
    ROM: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    RESET: load = ROM, type = ro, start = $E000;
    CHECKPOINT: load = ROM, type = ro, start = $E030;
    MARKER: load = ROM, type = ro, start = $E040;
    VECTORS: load = ROM, type = ro, start = $FFF6;
}
