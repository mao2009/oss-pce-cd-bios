# Diagnostic bank0: CPU reset selects MPR7=0; the 8 KiB CPU window is $E000-$FFFF.
# Geometry/vectors are sourced in spec/rom-contract.json; file decode is Gear-specific.
# This is not a production System Card layout; unknown contracts remain release-blocking.
MEMORY {
    ROM0: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    APITABLE: load = ROM0, type = ro, start = $E000;
    FALLBACK: load = ROM0, type = ro, start = $E100;
    # Keep all linked DEV overrides below the $E800-$EFFF diagnostic probe overlay.
    # Start $E292: the largest address that still links the 80-stub fixture
    # FALLBACK (ends $E291). The shadow-RMW display slots need the room; the
    # MA_MUL16S PC-window gate requires an even OVERRIDES size (see its harness).
    OVERRIDES: load = ROM0, type = ro, start = $E292, optional = yes;
    BOOT: load = ROM0, type = ro, start = $F000;
    VECTORS: load = ROM0, type = ro, start = $FFF6;
}
