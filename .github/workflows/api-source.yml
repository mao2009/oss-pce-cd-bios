name: BIOS DEV diagnostics (not compatible firmware)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bios-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare existing pinned source toolchain and Geargrafx
        run: make setup
      - name: Source inventory and diagnostic binary checks
        run: |
          python3 tools/contracts.py
          python3 tools/build_rom.py --check-source
          make dev-rom
          python3 -m unittest discover -s tests/host -p 'test_api*.py' -v
      - name: Real Geargrafx System Card diagnostic execution
        run: make dev-integration
      - name: Independent cold/warm System Card startup checkpoint (not BIOS boot)
        run: |
          make dev-startup
          python3 -m unittest discover -s tests/host -p 'test_startup.py' -v
          make dev-startup-integration
      - name: Independent CD-ROM2 sector read by guest HuC6280 (diagnostic, not CD_READ / not BIOS)
        run: |
          make dev-cdread
          python3 -m unittest tests.host.test_cdimage tests.host.test_cdread -v
          make dev-cdread-integration
      - name: Real-core CD_RESET bus-reset observation (diagnostic, not the System Card CD_RESET API)
        run: |
          make dev-cdreset
          python3 -m unittest tests.host.test_cdreset_bus -v
          make dev-cdreset-integration
      - name: Isolated Geargrafx trace harness (Issue #6, real core; diagnostic only)
        run: make dev-trace-integration
      - name: Debug and release diagnostic bytes match
        run: |
          make dev-rom MODE=release
          cmp build/debug/bios-dev/dev-only-not-compatible-syscard3.pce build/release/bios-dev/dev-only-not-compatible-syscard3.pce
          make dev-startup MODE=release
          cmp build/debug/startup-probe/startup-probe-not-bios.pce build/release/startup-probe/startup-probe-not-bios.pce
          make dev-cdread MODE=release
          cmp build/debug/cdread-probe/cdread-probe-not-bios.pce build/release/cdread-probe/cdread-probe-not-bios.pce
          make dev-cdreset MODE=release
          cmp build/debug/cdreset-probe/cdreset-probe-not-bios.pce build/release/cdreset-probe/cdreset-probe-not-bios.pce
      - name: Incomplete firmware must be refused by the release gate (exit 3 + BLOCKED only)
        run: make dev-release-gate-blocked
      - name: Static checks with pinned actionlint
        run: make check
      - name: Save diagnostic ROM and evidence, no linked GPL executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bios-dev-not-compatible-${{ github.sha }}
          path: |
            build/debug/bios-dev/*.pce
            build/debug/bios-dev/*.json
            build/debug/bios-dev/*.map
            build/debug/bios-dev/*.lbl
            build/debug/bios-dev/contract-probes/*.pce
            build/debug/bios-dev/contract-probes/*.json
            build/debug/bios-dev/contract-probes/*.map
            build/debug/bios-dev/contract-probes/*.lbl
            build/debug/startup-probe/*.pce
            build/debug/startup-probe/*.json
            build/debug/startup-probe/*.map
            build/debug/startup-probe/*.lbl
            build/debug/cdread-probe/*.pce
            build/debug/cdread-probe/*.json
            build/debug/cdread-probe/*.map
            build/debug/cdread-probe/*.lbl
            build/debug/cdreset-probe/*.pce
            build/debug/cdreset-probe/*.json
            build/debug/cdreset-probe/*.map
            build/debug/cdreset-probe/*.lbl
          if-no-files-found: error
          retention-days: 14
